document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

twinkle{0%,100%{opacity:.28;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}\n@keyframes dv-slidein{0%{opacity:0;transform:translateY(-16px)}100%{opacity:1;transform:translateY(0)}}\n@keyframes dv-walk{0%{transform:translateX(-16px)}100%{transform:translateX(232px)}}\n@keyframes dv-flapA{0%,45%{opacity:1}55%,100%{opacity:0}}\n@keyframes dv-flapB{0%,45%{opacity:0}55%,100%{opacity:1}}\n@keyframes dv-flappy{\n0%{transform:translate(-46px,60px)}\n7%{transform:translate(16px,6px)}\n20%{transform:translate(78px,62px)}\n27%{transform:translate(112px,12px)}\n40%{transform:translate(168px,66px)}\n47%{transform:translate(202px,16px)}\n60%{transform:translate(256px,64px)}\n67%{transform:translate(290px,18px)}\n82%{transform:translate(340px,60px)}\n100%{transform:translate(380px,96px);opacity:0}}\n.dv-bird{position:absolute;left:0}\n.dv-bird svg{position:absolute;top:0;left:0}\n.dv-bird .fa{animation:dv-flapA .28s steps(1) infinite}\n.dv-bird .fb{animation:dv-flapB .28s steps(1) infinite}\n.dv-ring{animation:dv-br 9s ease-in-out infinite}\n.imgpx{image-rendering:pixelated}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px\">\n<div class=\"phone\">\n<div class=\"notch\"><\u002Fdiv>\n<div class=\"screen\" style=\"background:#0a0a0a;color:#f4f2ee\">\n\n  <sc-if value=\"{{ notif }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:absolute;top:44px;left:12px;right:12px;z-index:60;background:#ffffff;border:1px solid #e2e2e2;border-radius:18px;padding:12px 13px;box-shadow:0 12px 28px -8px rgba(0,0,0,.4);animation:dv-slidein .3s ease;display:flex;gap:11px;align-items:flex-start\">\n    <div style=\"width:38px;height:38px;flex:none;border-radius:11px;background:#d4322b;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Doto';font-weight:900;font-size:14px\">{{ notif.init }}<\u002Fdiv>\n    <div style=\"flex:1;min-width:0\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:8px\">\n        <span style=\"font:700 13px 'Space Grotesk';color:#0a0a0a\">{{ notif.name }} is checking on you<\u002Fspan>\n        <button sc-camel-on-click=\"{{ dismissNotif }}\" style=\"border:none;background:none;color:#999;font-size:15px;cursor:pointer;line-height:1;padding:0\">×<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"font:400 12px/1.45 'Space Grotesk';color:#555;margin:4px 0 9px\">{{ notif.msg }}<\u002Fdiv>\n      <div style=\"display:flex;gap:8px\">\n        <button sc-camel-on-click=\"{{ replyNotif }}\" style=\"border:none;background:#0a0a0a;color:#fff;padding:7px 14px;border-radius:16px;font:600 11px 'Space Grotesk';cursor:pointer\">Reply<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ dismissNotif }}\" style=\"border:1px solid #ddd;background:none;color:#555;padding:7px 14px;border-radius:16px;font:600 11px 'Space Grotesk';cursor:pointer\">Later<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n\n  <!-- ============ SCREEN 0 : OPENED INSTAGRAM (usage intercept) ============ -->\n  <sc-if value=\"{{ isOpen }}\" hint-placeholder-val=\"{{ true }}\">\n  <div class=\"scr\" style=\"padding:60px 24px 26px;background:linear-gradient(#e4eefb,#eef4f7);color:#16324e;align-items:center;text-align:center\">\n    <div style=\"width:60px;height:60px;border-radius:16px;background:#2f5f9e;color:#eaf3ec;display:flex;align-items:center;justify-content:center;font-family:'Doto';font-weight:900;font-size:24px\">IG<\u002Fdiv>\n    <div style=\"font-family:'Doto';font-weight:600;font-size:30px;line-height:1.05;margin-top:20px\">You opened<br>Instagram<\u002Fdiv>\n    <div style=\"font:400 14px/1.5 'Space Grotesk';color:#5a7690;margin-top:10px;max-width:250px\">Here's where your time has gone today.<\u002Fdiv>\n\n    <div style=\"width:100%;background:#ffffff;border:1px solid #d3e0ef;border-radius:20px;padding:20px;margin-top:24px\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between\">\n        <div style=\"text-align:left\">\n          <div style=\"font:500 11px 'Space Grotesk';color:#6b8299;letter-spacing:.04em\">ON INSTAGRAM TODAY<\u002Fdiv>\n          <div class=\"px\" style=\"font-size:26px;color:#16324e;margin-top:6px\">1h 20m<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font:700 13px 'Space Grotesk';color:{{ stats.trendColor }}\">{{ stats.trendLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"height:1px;background:#e6eef6;margin:16px 0\"><\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;font:500 13px 'Space Grotesk';color:#5a7690\">\n        <span>Times opened<\u002Fspan><span style=\"color:#16324e;font-weight:700\">14×<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;font:500 13px 'Space Grotesk';color:#5a7690;margin-top:8px\">\n        <span>Points {{ stats.points.todayLabel }}<\u002Fspan><span style=\"color:{{ stats.points.todayColor }};font-weight:700\">{{ stats.points.total }} total<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <button sc-camel-on-click=\"{{ goBreathe }}\" style=\"width:100%;border:none;background:#2f5f9e;color:#eaf3ec;padding:17px;border-radius:30px;font:600 15px 'Space Grotesk';cursor:pointer;margin-top:auto\">Take a breath first →<\u002Fbutton>\n    <a href=\"#\" sc-camel-on-click=\"{{ goStats }}\" style=\"margin-top:16px;font:500 12px 'Space Grotesk';color:#6b8299;text-decoration:none\">See my full stats ›<\u002Fa>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ SCREEN 1 : BREATHE (30s) ============ -->\n  <sc-if value=\"{{ isBreathe }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"scr\" style=\"padding:56px 24px 24px;background:{{ sky.grad }};position:relative;overflow:hidden\">\n    <div style=\"position:absolute;inset:0;z-index:0;pointer-events:none\">\n      <sc-if value=\"{{ sky.showStars }}\" hint-placeholder-val=\"{{ false }}\">\n        <sc-for list=\"{{ dots }}\" as=\"d\" hint-placeholder-count=\"10\">\n          <div style=\"position:absolute;left:{{ d.l }}px;top:{{ d.t }}px;width:{{ d.s }}px;height:{{ d.s }}px;background:#f2f6ff;opacity:.85\"><\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"position:absolute;top:60px;right:28px;animation:dv-shoot 7s ease-in infinite\">\n          <div style=\"width:48px;height:3px;background:linear-gradient(90deg,transparent,#ffffff);transform:rotate(150deg);border-radius:2px\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position:absolute;top:120px;right:150px;animation:dv-shoot 9.5s ease-in infinite;animation-delay:-4.5s\">\n          <div style=\"width:38px;height:2px;background:linear-gradient(90deg,transparent,#dbe7ff);transform:rotate(150deg);border-radius:2px\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ sky.showSun }}\" hint-placeholder-val=\"{{ true }}\">\n        <svg class=\"imgpx\" sc-camel-view-box=\"0 0 8 8\" width=\"44\" height=\"44\" shape-rendering=\"crispEdges\" style=\"position:absolute;top:{{ sky.sunTop }}px;left:26px;opacity:.9\" fill=\"{{ sky.sunColor }}\"><sc-for list=\"{{ motif.disc }}\" as=\"px\" hint-placeholder-count=\"30\"><rect x=\"{{ px.x }}\" y=\"{{ px.y }}\" width=\"1\" height=\"1\"><\u002Frect><\u002Fsc-for><\u002Fsvg>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ sky.showMoon }}\" hint-placeholder-val=\"{{ false }}\">\n        <svg class=\"imgpx\" sc-camel-view-box=\"0 0 10 10\" width=\"52\" height=\"52\" shape-rendering=\"crispEdges\" style=\"position:absolute;top:{{ sky.sunTop }}px;right:30px;opacity:.98\"><sc-for list=\"{{ moonCells }}\" as=\"px\" hint-placeholder-count=\"40\"><rect x=\"{{ px.x }}\" y=\"{{ px.y }}\" width=\"1\" height=\"1\" fill=\"{{ px.color }}\"><\u002Frect><\u002Fsc-for><\u002Fsvg>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ sky.showClouds }}\" hint-placeholder-val=\"{{ true }}\">\n        <svg class=\"imgpx\" sc-camel-view-box=\"0 0 8 8\" width=\"58\" height=\"58\" shape-rendering=\"crispEdges\" style=\"position:absolute;top:110px;right:22px;opacity:.9\"><sc-for list=\"{{ motif.cloud }}\" as=\"px\" hint-placeholder-count=\"30\"><rect x=\"{{ px.x }}\" y=\"{{ px.y }}\" width=\"1\" height=\"1\" fill=\"{{ px.color }}\"><\u002Frect><\u002Fsc-for><\u002Fsvg>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ sky.showBirds }}\" hint-placeholder-val=\"{{ true }}\">\n        <svg class=\"imgpx\" sc-camel-view-box=\"0 0 8 8\" width=\"26\" height=\"26\" shape-rendering=\"crispEdges\" style=\"position:absolute;top:150px;left:44px;opacity:.7\"><sc-for list=\"{{ motif.bird }}\" as=\"px\" hint-placeholder-count=\"6\"><rect x=\"{{ px.x }}\" y=\"{{ px.y }}\" width=\"1\" height=\"1\" fill=\"{{ px.color }}\"><\u002Frect><\u002Fsc-for><\u002Fsvg>\n        <svg class=\"imgpx\" sc-camel-view-box=\"0 0 8 8\" width=\"18\" height=\"18\" shape-rendering=\"crispEdges\" style=\"position:absolute;top:184px;left:96px;opacity:.55\"><sc-for list=\"{{ motif.bird }}\" as=\"px\" hint-placeholder-count=\"6\"><rect x=\"{{ px.x }}\" y=\"{{ px.y }}\" width=\"1\" height=\"1\" fill=\"{{ px.color }}\"><\u002Frect><\u002Fsc-for><\u002Fsvg>\n      <\u002Fsc-if>\n      <svg class=\"imgpx\" sc-camel-view-box=\"0 0 24 8\" width=\"100%\" height=\"120\" sc-camel-preserve-aspect-ratio=\"none\" shape-rendering=\"crispEdges\" style=\"position:absolute;bottom:118px;left:0;opacity:.4\"><sc-for list=\"{{ motif.mountains }}\" as=\"px\" hint-placeholder-count=\"60\"><rect x=\"{{ px.x }}\" y=\"{{ px.y }}\" width=\"1\" height=\"1\" fill=\"{{ px.color }}\"><\u002Frect><\u002Fsc-for><\u002Fsvg>\n      <sc-if value=\"{{ sky.morning }}\" hint-placeholder-val=\"{{ false }}\">\n        <svg class=\"imgpx\" sc-camel-view-box=\"0 0 8 11\" width=\"34\" height=\"47\" shape-rendering=\"crispEdges\" style=\"position:absolute;bottom:120px;left:52px\"><sc-for list=\"{{ motif.creeper }}\" as=\"px\" hint-placeholder-count=\"40\"><rect x=\"{{ px.x }}\" y=\"{{ px.y }}\" width=\"1\" height=\"1\" fill=\"{{ px.color }}\"><\u002Frect><\u002Fsc-for><\u002Fsvg>\n        <svg class=\"imgpx\" sc-camel-view-box=\"0 0 8 11\" width=\"32\" height=\"44\" shape-rendering=\"crispEdges\" style=\"position:absolute;bottom:120px;right:56px\"><sc-for list=\"{{ motif.villager }}\" as=\"px\" hint-placeholder-count=\"40\"><rect x=\"{{ px.x }}\" y=\"{{ px.y }}\" width=\"1\" height=\"1\" fill=\"{{ px.color }}\"><\u002Frect><\u002Fsc-for><\u002Fsvg>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;width:100%\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;width:100%\">\n        <div class=\"px\" style=\"font-size:9px;letter-spacing:.05em;color:{{ sky.kicker }}\">TIME'S UP ON INSTAGRAM<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ toggleSound }}\" style=\"border:1px solid {{ sky.kicker }};background:rgba(255,255,255,.12);color:{{ sky.strong }};padding:5px 10px;border-radius:16px;font:600 10px 'Space Grotesk';cursor:pointer\">{{ soundLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"flex:1;display:flex;align-items:center;justify-content:center;width:100%\">\n        <div style=\"position:relative;width:230px;height:230px;display:flex;align-items:center;justify-content:center\">\n          <svg class=\"dv-ring imgpx\" sc-camel-view-box=\"0 0 16 16\" width=\"230\" height=\"230\" shape-rendering=\"crispEdges\" style=\"position:absolute;inset:0\">\n            <sc-for list=\"{{ ringCells }}\" as=\"px\" hint-placeholder-count=\"30\">\n              <rect x=\"{{ px.x }}\" y=\"{{ px.y }}\" width=\"1\" height=\"1\" fill=\"{{ px.color }}\"><\u002Frect>\n            <\u002Fsc-for>\n          <\u002Fsvg>\n          <div style=\"position:relative;text-align:center\">\n            <div class=\"px\" style=\"font-size:34px;line-height:1;color:{{ sky.strong }}\">{{ secsLabel }}<\u002Fdiv>\n            <div style=\"position:relative;height:24px;margin-top:14px\">\n              <span style=\"position:absolute;left:50%;top:0;transform:translateX(-50%);white-space:nowrap;font:700 20px 'Space Grotesk';letter-spacing:.01em;color:{{ sky.strong }};animation:dv-in 9s ease-in-out infinite\">breathe in<\u002Fspan>\n              <span style=\"position:absolute;left:50%;top:0;transform:translateX(-50%);white-space:nowrap;font:700 20px 'Space Grotesk';letter-spacing:.01em;color:{{ sky.label2 }};animation:dv-out 9s ease-in-out infinite\">breathe out<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ goStats }}\" disabled=\"{{ breatheLocked }}\" style=\"width:100%;border:none;background:{{ breatheBtnBg }};color:{{ breatheBtnFg }};padding:17px;border-radius:30px;font:600 15px 'Space Grotesk';cursor:{{ breatheCursor }}\">{{ breatheBtnLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ SCREEN 2 : DO THIS INSTEAD ============ -->\n  <sc-if value=\"{{ isInstead }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"scr\" style=\"padding:56px 22px 20px;background:{{ theme.bg }};color:{{ theme.ink }}\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:4px\">\n      <span class=\"px\" style=\"font-size:8px;color:{{ theme.muted }}\">INSTEAD OF SCROLLING<\u002Fspan>\n      <button sc-camel-on-click=\"{{ toggleTheme }}\" style=\"display:flex;align-items:center;gap:5px;border:1px solid {{ theme.toggleBorder }};background:{{ theme.toggleBg }};color:{{ theme.muted }};border-radius:16px;padding:5px 10px;font:600 10px 'Space Grotesk';cursor:pointer\">{{ themeIcon }}<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:6px;font:500 11px 'Space Grotesk';color:{{ theme.muted }};margin-bottom:12px\"><span style=\"width:6px;height:6px;border-radius:50%;background:#5b8c5a\"><\u002Fspan>1h 12m saved<\u002Fdiv>\n    <div style=\"font-family:'Doto';font-weight:600;font-size:28px;line-height:1.02;margin-bottom:14px;color:{{ theme.ink }}\">Pick something<br>real.<\u002Fdiv>\n    <div style=\"flex:1;overflow-y:auto;margin:0 -22px;padding:0 22px 4px\">\n      <div class=\"px\" style=\"font-size:8px;color:{{ theme.muted }};margin-bottom:10px\">YOUR APPS<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px\">\n        <sc-for list=\"{{ pApps }}\" as=\"p\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ p.open }}\" style=\"display:flex;align-items:center;gap:10px;border:3px solid {{ theme.chipBorder }};background:{{ theme.chipBg }};color:{{ theme.ink }};border-radius:0;padding:11px 12px;cursor:pointer\">\n            <span style=\"width:32px;height:32px;border-radius:8px;background:{{ p.iconBg }};color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px\">{{ p.glyph }}<\u002Fspan>\n            <span style=\"font:600 14px 'Space Grotesk';text-align:left\">{{ p.name }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ linkApp }}\" style=\"width:100%;border:2px dashed {{ theme.dashed }};background:none;color:{{ theme.muted }};border-radius:0;padding:11px;margin-bottom:16px;cursor:pointer;font:600 12px 'Space Grotesk'\">+ add an app<\u002Fbutton>\n\n      <button sc-camel-on-click=\"{{ toggleReal }}\" style=\"width:100%;border:none;background:#5b8c5a;color:#fff;border-radius:0;padding:14px;margin-bottom:16px;cursor:pointer;font:700 13px 'Space Grotesk';display:flex;align-items:center;justify-content:center;gap:8px\">{{ realLabel }}<\u002Fbutton>\n\n      <sc-if value=\"{{ showReal }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start\">\n        <sc-for list=\"{{ acts }}\" as=\"act\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ act.open }}\" style=\"text-align:left;border:3px solid {{ act.border }};background:{{ act.bg }};color:{{ act.fg }};border-radius:0;padding:12px 11px 10px;height:150px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;overflow:hidden\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between\">\n              <span class=\"px\" style=\"font-size:9px\">{{ act.name }}<\u002Fspan>\n              <span style=\"width:8px;height:8px;background:{{ act.dotAccent }}\"><\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"flex:1;display:flex;align-items:center;justify-content:center;animation:{{ act.anim }}\">\n              <svg class=\"imgpx\" sc-camel-view-box=\"{{ act.viewBox }}\" width=\"44\" height=\"44\" shape-rendering=\"crispEdges\">\n                <sc-for list=\"{{ act.cells }}\" as=\"px\" hint-placeholder-count=\"18\">\n                  <rect x=\"{{ px.x }}\" y=\"{{ px.y }}\" width=\"1\" height=\"1\" fill=\"{{ px.color }}\"><\u002Frect>\n                <\u002Fsc-for>\n              <\u002Fsvg>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between\">\n              <span style=\"font:500 11px 'Space Grotesk';opacity:.65\">{{ act.unit }}<\u002Fspan>\n              <span class=\"px\" style=\"font-size:7px;opacity:.5\">{{ act.tag }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n        <button sc-camel-on-click=\"{{ goSearch }}\" style=\"border:3px solid {{ theme.browseBorder }};background:{{ theme.chipBg }};color:{{ theme.ink }};border-radius:0;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer\">\n          <span class=\"px\" style=\"font-size:12px;color:#5b8c5a\">⚲<\u002Fspan>\n          <span class=\"px\" style=\"font-size:8px\">BROWSE<\u002Fspan>\n        <\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goEditor }}\" style=\"borde
