\"font:600 15px 'Space Grotesk';color:#16324e\">📍 {{ p.place }}<\u002Fspan>\n              <span style=\"font:500 11px 'Space Grotesk';color:#6b8299\">{{ p.by }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font:400 12px/1.45 'Space Grotesk';color:#5a7690;margin-top:5px\">{{ p.tip }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ addWalkPost }}\" style=\"margin-top:12px;border:none;background:#16324e;color:#eaf3ec;padding:15px;border-radius:30px;font:600 14px 'Space Grotesk';cursor:pointer\">📷 Post where you walked<\u002Fbutton>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ SCREEN 3 : PIXEL EDITOR ============ -->\n  <sc-if value=\"{{ isEditor }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"scr\" style=\"padding:56px 20px 18px;background:#141414;overflow-y:auto\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:12px\">\n      <span class=\"px\" style=\"font-size:11px;color:#f5d000\">PIXEL STUDIO<\u002Fspan>\n      <button sc-camel-on-click=\"{{ goInstead }}\" style=\"background:none;border:1px solid #333;color:#888;padding:7px 12px;border-radius:20px;font:500 11px 'Space Grotesk';cursor:pointer\">close<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"font:400 12px/1.5 'Space Grotesk';color:#999;margin-bottom:12px\">Draw the activity you want to do. Tap or drag on the grid.<\u002Fdiv>\n    <div sc-camel-on-pointer-up=\"{{ ed.stop }}\" sc-camel-on-pointer-leave=\"{{ ed.stop }}\" style=\"display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(12,1fr);gap:1px;background:#000;border:2px solid #333;width:100%;aspect-ratio:1;touch-action:none\">\n      <sc-for list=\"{{ ed.cells }}\" as=\"c\" hint-placeholder-count=\"36\">\n        <div sc-camel-on-pointer-down=\"{{ c.down }}\" sc-camel-on-pointer-enter=\"{{ c.enter }}\" style=\"background:{{ c.bg }};cursor:crosshair\"><\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 10px\">\n      <sc-for list=\"{{ ed.palette }}\" as=\"sw\" hint-placeholder-count=\"8\">\n        <button sc-camel-on-click=\"{{ sw.pick }}\" title=\"{{ sw.title }}\" style=\"width:32px;height:32px;border-radius:8px;border:3px solid {{ sw.ring }};background:{{ sw.swatch }};cursor:pointer;background-size:8px 8px\"><\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ goCommunity }}\" style=\"width:100%;border:2px solid #333;background:#0a0a0a;color:#f4f2ee;border-radius:12px;padding:13px;margin-bottom:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px\">\n      <span style=\"color:#38d15a;font-size:15px\">⚲<\u002Fspan>\n      <span style=\"font:600 13px 'Space Grotesk'\">Start from a community design<\u002Fspan>\n    <\u002Fbutton>\n    <div style=\"display:flex;gap:10px\">\n      <button sc-camel-on-click=\"{{ ed.clear }}\" style=\"border:1px solid #333;background:none;color:#888;padding:13px 16px;border-radius:24px;font:500 13px 'Space Grotesk';cursor:pointer\">Clear<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ ed.toDesc }}\" disabled=\"{{ ed.continueLocked }}\" style=\"flex:1;border:none;background:{{ ed.continueBg }};color:{{ ed.continueFg }};padding:13px;border-radius:24px;font:700 14px 'Space Grotesk';cursor:{{ ed.continueCursor }}\">Continue →<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ SCREEN 3b : DESCRIPTION PAGE ============ -->\n  <sc-if value=\"{{ isEditDesc }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"scr\" style=\"padding:56px 20px 18px;background:#141414;overflow-y:auto\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:16px\">\n      <span class=\"px\" style=\"font-size:11px;color:#f5d000\">DESCRIBE IT<\u002Fspan>\n      <button sc-camel-on-click=\"{{ ed.backToDraw }}\" style=\"background:none;border:1px solid #333;color:#888;padding:7px 12px;border-radius:20px;font:500 11px 'Space Grotesk';cursor:pointer\">← edit art<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:16px;margin-bottom:22px\">\n      <div style=\"border:3px solid #f5d000;padding:8px;background:#0a0a0a\">\n        <svg class=\"imgpx\" sc-camel-view-box=\"0 0 12 12\" width=\"60\" height=\"60\" shape-rendering=\"crispEdges\">\n          <sc-for list=\"{{ ed.previewCells }}\" as=\"px\" hint-placeholder-count=\"18\">\n            <rect x=\"{{ px.x }}\" y=\"{{ px.y }}\" width=\"1\" height=\"1\" fill=\"{{ px.color }}\"><\u002Frect>\n          <\u002Fsc-for>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"font:400 13px/1.5 'Space Grotesk';color:#999\">Nice work. Now tell yourself what this activity actually is.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"px\" style=\"font-size:8px;color:#666;margin-bottom:8px\">NAME IT<\u002Fdiv>\n    <input value=\"{{ ed.name }}\" sc-camel-on-change=\"{{ ed.setName }}\" placeholder=\"NAME IT\" sc-camel-max-length=\"10\" style=\"width:100%;box-sizing:border-box;background:#0a0a0a;border:2px solid #333;color:#f4f2ee;border-radius:10px;padding:12px;font-family:'Press Start 2P',monospace;font-size:10px;outline:none;margin-bottom:16px\">\n    <div class=\"px\" style=\"font-size:8px;color:#666;margin-bottom:10px\">DESCRIBE YOUR TASK<\u002Fdiv>\n    <textarea value=\"{{ ed.desc }}\" sc-camel-on-change=\"{{ ed.setDesc }}\" placeholder=\"What is this activity? e.g. read 20 pages of the library book, phone in another room…\" rows=\"6\" style=\"width:100%;box-sizing:border-box;resize:none;background:#0a0a0a;border:2px solid #333;color:#f4f2ee;border-radius:12px;padding:16px;font:400 16px/1.55 'Space Grotesk';outline:none;margin-bottom:16px\"><\u002Ftextarea>\n    <button sc-camel-on-click=\"{{ ed.save }}\" style=\"margin-top:auto;border:none;background:#f5d000;color:#0a0a0a;padding:16px;border-radius:28px;font:700 15px 'Space Grotesk';cursor:pointer\">Save widget<\u002Fbutton>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ SCREEN 3.5 : SEARCH pre-made widgets ============ -->\n  <sc-if value=\"{{ isSearch }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"scr\" style=\"padding:56px 20px 18px;background:#141414\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:12px\">\n      <span class=\"px\" style=\"font-size:11px;color:#38d15a\">BROWSE WIDGETS<\u002Fspan>\n      <button sc-camel-on-click=\"{{ goInstead }}\" style=\"background:none;border:1px solid #333;color:#888;padding:7px 12px;border-radius:20px;font:500 11px 'Space Grotesk';cursor:pointer\">close<\u002Fbutton>\n    <\u002Fdiv>\n    <input value=\"{{ searchVal }}\" sc-camel-on-change=\"{{ setSearch }}\" placeholder=\"Search activities…\" style=\"width:100%;box-sizing:border-box;background:#0a0a0a;border:2px solid #333;color:#f4f2ee;border-radius:12px;padding:13px 14px;font:400 14px 'Space Grotesk';outline:none;margin-bottom:14px\">\n    <div style=\"flex:1;overflow-y:auto;margin:0 -20px;padding:0 20px\">\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n        <sc-for list=\"{{ searchResults }}\" as=\"r\" hint-placeholder-count=\"6\">\n          <button sc-camel-on-click=\"{{ r.pick }}\" style=\"text-align:left;border:3px solid {{ r.border }};background:#0a0a0a;color:#f4f2ee;border-radius:0;padding:12px 11px;height:132px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer\">\n            <span class=\"px\" style=\"font-size:9px\">{{ r.name }}<\u002Fspan>\n            <div style=\"flex:1;display:flex;align-items:center;justify-content:center\">\n              <svg class=\"imgpx\" sc-camel-view-box=\"{{ r.viewBox }}\" width=\"52\" height=\"52\" shape-rendering=\"crispEdges\">\n                <sc-for list=\"{{ r.cells }}\" as=\"px\" hint-placeholder-count=\"18\">\n                  <rect x=\"{{ px.x }}\" y=\"{{ px.y }}\" width=\"1\" height=\"1\" fill=\"{{ px.color }}\"><\u002Frect>\n                <\u002Fsc-for>\n              <\u002Fsvg>\n            <\u002Fdiv>\n            <span style=\"font:500 11px 'Space Grotesk';opacity:.6\">{{ r.unit }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ add-with-description overlay ============ -->\n  <sc-if value=\"{{ isAdding }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"scr\" style=\"padding:56px 24px 24px;background:#141414\">\n    <button sc-camel-on-click=\"{{ cancelAdd }}\" style=\"align-self:flex-start;background:none;border:1px solid #333;color:#888;padding:8px 14px;border-radius:30px;font:500 12px 'Space Grotesk';cursor:pointer;margin-bottom:18px\">← back<\u002Fbutton>\n    <div style=\"display:flex;align-items:center;gap:16px;margin-bottom:20px\">\n      <div style=\"border:3px solid {{ adding.border }};padding:8px;background:#0a0a0a\">\n        <svg class=\"imgpx\" sc-camel-view-box=\"{{ adding.viewBox }}\" width=\"56\" height=\"56\" shape-rendering=\"crispEdges\">\n          <sc-for list=\"{{ adding.cells }}\" as=\"px\" hint-placeholder-count=\"18\">\n            <rect x=\"{{ px.x }}\" y=\"{{ px.y }}\" width=\"1\" height=\"1\" fill=\"{{ px.color }}\"><\u002Frect>\n          <\u002Fsc-for>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div>\n        <div class=\"px\" style=\"font-size:14px\">{{ adding.name }}<\u002Fdiv>\n        <div style=\"font:500 12px 'Space Grotesk';color:#888;margin-top:6px\">{{ adding.unit }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"px\" style=\"font-size:8px;color:#666;margin-bottom:10px\">DESCRIBE YOUR TASK<\u002Fdiv>\n    <textarea value=\"{{ descVal }}\" sc-camel-on-change=\"{{ setDesc }}\" placeholder=\"e.g. read 20 pages of the library book, no phone nearby\" rows=\"4\" style=\"width:100%;box-sizing:border-box;resize:none;background:#0a0a0a;border:2px solid #333;color:#f4f2ee;border-radius:12px;padding:14px;font:400 14px/1.5 'Space Grotesk';outline:none\"><\u002Ftextarea>\n    <button sc-camel-on-click=\"{{ confirmAdd }}\" style=\"margin-top:auto;border:none;background:#38d15a;color:#0a0a0a;padding:17px;border-radius:30px;font:700 15px 'Space Grotesk';cursor:pointer\">Add to my widgets<\u002Fbutton>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ SCREEN : COMMUNITY DESIGNS ============ -->\n  <sc-if value=\"{{ isCommunity }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"scr\" style=\"padding:56px 20px 18px;background:#141414\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:8px\">\n      <span class=\"px\" style=\"font-size:11px;color:#38d15a\">COMMUNITY<\u002Fspan>\n      <button sc-camel-on-click=\"{{ goEditor }}\" style=\"background:none;border:1px solid #333;color:#888;padding:7px 12px;border-radius:20px;font:500 11px 'Space Grotesk';cursor:pointer\">close<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"font:400 13px/1.5 'Space Grotesk';color:#999;margin-bottom:16px\">Designs shared by others. Tap one to load it onto your canvas and make it yours.<\u002Fdiv>\n    <div style=\"flex:1;overflow-y:auto;margin:0 -20px;padding:0 20px\">\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n        <sc-for list=\"{{ ed.community }}\" as=\"cm\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ cm.load }}\" style=\"border:2px solid #333;background:#0a0a0a;border-radius:16px;padding:16px 12px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px\">\n            <svg class=\"imgpx\" sc-camel-view-box=\"{{ cm.viewBox }}\" width=\"84\" height=\"84\" shape-rendering=\"crispEdges\">\n              <sc-for list=\"{{ cm.cells }}\" as=\"px\" hint-placeholder-count=\"12\">\n                <rect x=\"{{ px.x }}\" y=\"{{ px.y }}\" width=\"1\" height=\"1\" fill=\"{{ px.color }}\"><\u002Frect>\n              <\u002Fsc-for>\n            <\u002Fsvg>\n            <div style=\"text-align:center\">\n              <div style=\"font:600 14px 'Space Grotesk';color:#f4f2ee\">{{ cm.name }}<\u002Fdiv>\n              <div style=\"font:400 11px 'Space Grotesk';color:#777;margin-top:2px\">{{ cm.author }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ SCREEN : YOUR STATS ============ -->\n  <sc-if value=\"{{ isStats }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"scr\" style=\"padding:56px 22px 20px;background:linear-gradient(#e4eefb,#eaf3f7);color:#16324e;overflow-y:auto\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:16px\">\n      <div style=\"font-family:'Doto';font-weight:600;font-size:26px;line-height:1\">Your week<\u002Fdiv>\n      <button sc-camel-on-click=\"{{ goInstead }}\" style=\"background:none;border:1px solid #bcd0e6;color:#5a7690;padding:7px 12px;border-radius:20px;font:500 11px 'Space Grotesk';cursor:pointer\">close<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div style=\"background:#16324e;border-radius:20px;padding:18px;margin-bottom:14px;color:#eaf3ec\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between\">\n        <div style=\"font:500 11px 'Space Grotesk';color:#9fb6d0;letter-spacing:.04em\">YOUR POINTS<\u002Fdiv>\n        <span style=\"font:700 12px 'Space Grotesk';color:{{ stats.points.todayColor }};background:#ffffff;padding:3px 9px;border-radius:12px\">{{ stats.points.todayLabel }}<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"px\" style=\"font-size:34px;color:#ffffff;margin-top:8px\">{{ stats.points.total }}<\u002Fdiv>\n      <div style=\"font:400 12px/1.5 'Space Grotesk';color:#9fb6d0;margin-top:8px\">Stay under your <b style=\"color:#fff\">{{ stats.points.limitLabel }}<\u002Fb> limit to earn points. Go over and you lose them.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#ffffff;border:1px solid #d3e0ef;border-radius:20px;padding:18px;margin-bottom:14px\">\n      <div style=\"font:500 11px 'Space Grotesk';color:#6b8299;letter-spacing:.04em\">TODAY'S SCREEN TIME<\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:12px;margin-top:6px\">\n        <div class=\"px\" style=\"font-size:30px;color:#16324e\">{{ stats.today }}<\u002Fdiv>\n        <div style=\"font:700 13px 'Space Grotesk';color:{{ stats.trendColor }}\">{{ stats.trendLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font:400 12px 'Space Grotesk';color:#6b8299;margin-top:8px\">Daily average this week: <b style=\"color:#16324e\">{{ stats.avg }}<\u002Fb><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#ffffff;border:1px solid #d3e0ef;border-radius:20px;padding:18px 16px 14px;margin-bottom:14px\">\n      <div style=\"font:500 11px 'Space Grotesk';color:#6b8299;letter-spacing:.04em;margin-bottom:14px\">LAST 7 DAYS<\u002Fdiv>\n      <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:8px;height:120px\">\n        <sc-for list=\"{{ stats.days }}\" as=\"d\" hint-placeholder-count=\"7\">\n          <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:8px\">\n            <div style=\"width:100%;height:{{ d.pct }};background:{{ d.color }};border-radius:3px 3px 0 0\"><\u002Fdiv>\n            <span style=\"font:600 11px 'Space Grotesk';color:#6b8299\">{{ d.label }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:{{ stats.trendColor }};border-radius:20px;padding:16px 18px;margin-bottom:14px;color:#ffffff\">\n      <div style=\"font:700 16px 'Space Grotesk'\">{{ stats.headline }}<\u002Fdiv>\n      <div style=\"font:400 12px/1.5 'Space Grotesk';opacity:.9;margin-top:4px\">{{ stats.sub }}<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"font:500 11px 'Space Grotesk';color:#6b8299;letter-spacing:.04em;margin-bottom:10px\">BY APP · VS LAST WEEK<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:8px\">\n      <sc-for list=\"{{ stats.apps }}\" as=\"a\" hint-placeholder-count=\"4\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;background:#ffffff;border:1px solid #d3e0ef;border-radius:14px;padding:12px 14px\">\n          <span style=\"font:600 14px 'Space Grotesk';color:#16324e\">{{ a.name }}<\u002Fspan>\n          <div style=\"display:flex;align-items:baseline;gap:10px\">\n            <span style=\"font:500 13px 'Space Grotesk';color:#6b8299\">{{ a.time }}<\u002Fspan>\n            <span style=\"font:700 12px 'Space Grotesk';color:{{ a.deltaColor }};min-width:52px;text-align:right\">{{ a.delta }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ SCREEN 4 : THE CIRCLE (friends) ============ -->\n  <sc-if value=\"{{ isFriends }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"scr\" style=\"padding:56px 22px 20px;background:linear-gradient(#e9f2f7,#eef4ea);color:#16324e\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:14px\">\n      <div style=\"font-family:'Doto';font-weight:600;font-size:26px;line-height:1\">The circle<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:6px;font:500 11px 'Space Grotesk';color:#6b8299\"><span style=\"width:6px;height:6px;border-radius:50%;background:#5b8c5a\"><\u002Fspan>4 online<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px;flex:1;overflow-y:auto;margin:0 -22px;padding:0 22px\">\n      <sc-for list=\"{{ friends }}\" as=\"f\" hint-placeholder-count=\"4\">\n        <div style=\"border:1px solid #d3e0ef;background:#ffffff;border-radius:20px;padding:14px 15px\">\n          <div style=\"display:flex;align-items:center;gap:12px\">\n            <div style=\"width:40px;height:40px;border-radius:12px;background:{{ f.avBg }};color:{{ f.avFg }};display:flex;align-items:center;justify-content:center;font-family:'Doto';font-weight:900;font-size:16px\">{{ f.init }}<\u002Fdiv>\n            <div style=\"flex:1;min-width:0\">\n              <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:8px\">\n                <span style=\"font:600 15px 'Space Grotesk'\">{{ f.name }}<\u002Fspan>\n                <span style=\"font-family:'Doto';font-weight:600;font-size:15px;color:{{ f.hrsColor }}\">{{ f.hrs }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font:400 12px 'Space Grotesk';color:#6b8299\">{{ f.top }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"height:6px;border-radius:4px;background:#e6eef6;margin:11px 0;overflow:hidden\"><div style=\"height:100%;width:{{ f.pct }};background:{{ f.barColor }};border-radius:4px\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:8px\">\n            <button sc-camel-on-click=\"{{ f.nudge }}\" style=\"flex:1;border:1px solid #c3d6e0;background:{{ f.nudgeBg }};color:{{ f.nudgeFg }};padding:9px;border-radius:24px;font:500 12px 'Space Grotesk';cursor:pointer\">{{ f.nudgeLabel }}<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ f.study }}\" style=\"flex:1;border:1px solid #c3d6e0;background:none;color:#5a7690;padding:9px;border-radius:24px;font:500 12px 'Space Grotesk';cursor:pointer\">{{ f.studyLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:10px;margin-top:12px\">\n      <button sc-camel-on-click=\"{{ goSupport }}\" style=\"flex:1;border:1px solid #c3d6e0;background:#fff;color:#2f5f9e;padding:14px;border-radius:30px;font:600 13px 'Space Grotesk';cursor:pointer\">💙 Support wall<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ goInstead }}\" style=\"flex:1;border:none;background:#2f5f9e;color:#fff;padding:14px;border-radius:30px;font:600 13px 'Space Grotesk';cursor:pointer\">My apps →<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ SCREEN : SUPPORT WALL (anonymous, support-only) ============ -->\n  <sc-if value=\"{{ isSupport }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"scr\" style=\"padding:56px 22px 20px;background:linear-gradient(#eef2fb,#f2eef7);color:#26304a;position:relative\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:4px\">\n      <div style=\"font-family:'Doto';font-weight:600;font-size:24px;line-height:1\">Support wall<\u002Fdiv>\n      <button sc-camel-on-click=\"{{ goFriends }}\" style=\"background:none;border:1px solid #cdd3e6;color:#6a7290;padding:7px 12px;border-radius:20px;font:500 11px 'Space Grotesk';cursor:pointer\">close<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"font:400 12px/1.5 'Space Grotesk';color:#7a80a0;margin-bottom:14px\">Anonymous. No comments — just send support. You can only message people in your own age group.<\u002Fdiv>\n    <div style=\"flex:1;overflow-y:auto;margin:0 -22px;padding:0 22px 4px;display:flex;flex-direction:column;gap:12px\">\n      <sc-for list=\"{{ supportPosts }}\" as=\"p\" hint-placeholder-count=\"4\">\n        <div style=\"border:1px solid #dcd8ee;background:#fff;border-radius:18px;padding:14px 15px\">\n          <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:8px\">\n            <div style=\"width:26px;height:26px;border-radius:50%;background:#c9cfe8;display:flex;align-items:center;justify-content:center;font-size:12px\">👤<\u002Fdiv>\n            <span style=\"font:500 11px 'Space Grotesk';color:#9298b8\">anonymous · {{ p.tag }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font:400 14px/1.5 'Space Grotesk';color:#333a55\">{{ p.text }}<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;margin-top:12px\">\n            <button sc-camel-on-click=\"{{ p.support }}\" style=\"flex:1;border:1px solid #cdd3e6;background:{{ p.sentBg }};color:{{ p.sentFg }};padding:9px;border-radius:24px;font:600 12px 'Space Grotesk';cursor:pointer\">{{ p.sentLabel }} · {{ p.supports }}<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ p.request }}\" style=\"border:1px solid #cdd3e6;background:{{ p.reqBg }};color:#5a6390;padding:9px 14px;border-radius:24px;font:600 12px 'Space Grotesk';cursor:pointer\">{{ p.reqLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ addSupportPost }}\" style=\"margin-top:12px;border:none;background:#2f5f9e;color:#fff;padding:15px;border-radius:30px;font:600 14px 'Space Grotesk';cursor:pointer\">Share anonymously<\u002Fbutton>\n\n    <sc-if value=\"{{ gate }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;z-index:70;background:rgba(20,24,40,.55);display:flex;align-items:flex-end\">\n        <div style=\"background:#fff;border-radius:24px 24px 0 0;padding:24px 22px 26px;width:100%;box-sizing:border-box\">\n          <div style=\"width:36px;height:4px;border-radius:2px;background:#d8dcea;margin:0 auto 18px\"><\u002Fdiv>\n          <div style=\"font-size:26px;margin-bottom:8px\">🔒<\u002Fdiv>\n          <div style=\"font:700 18px 'Space Grotesk';color:#26304a;margin-bottom:8px\">Messaging is for people your age<\u002Fdiv>\n          <div style=\"font:400 13px/1.6 'Space Grotesk';color:#6a7290;margin-bottom:18px\">You can send support to anyone anonymously, but you can only chat with people in your own age group — this keeps younger and older users apart. Ages are verified at sign-up; anyone caught lying about their age loses messaging for good.<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ closeGate }}\" style=\"width:100%;border:none;background:#2f5f9e;color:#fff;padding:15px;border-radius:30px;font:600 14px 'Space Grotesk';cursor:pointer\">Got it<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ SCREEN : STUDY-TOGETHER-anchor ============ -->\n  <!-- ============ SCREEN : STUDY TOGETHER ============ -->\n  <sc-if value=\"{{ isStudy }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"scr\" style=\"padding:56px 24px 26px;background:linear-gradient(#16324e,#0d1f33);color:#dfe9f5;align-items:center;text-align:center;position:relative;overflow:hidden\">\n    <svg class=\"imgpx\" sc-camel-view-box=\"0 0 8 8\" width=\"40\" height=\"40\" shape-rendering=\"crispEdges\" style=\"position:absolute;bottom:96px;left:18px;opacity:.85\"><sc-for list=\"{{ studyPlant }}\" as=\"px\" hint-placeholder-count=\"16\"><rect x=\"{{ px.x }}\" y=\"{{ px.y }}\" width=\"1\" height=\"1\" fill=\"{{ px.color }}\"><\u002Frect><\u002Fsc-for><\u002Fsvg>\n    <svg class=\"imgpx\" sc-camel-view-box=\"0 0 8 8\" width=\"34\" height=\"34\" shape-rendering=\"crispEdges\" style=\"position:absolute;bottom:100px;right:20px;opacity:.85\"><sc-for list=\"{{ studyPlant }}\" as=\"px\" hint-placeholder-count=\"16\"><rect x=\"{{ px.x }}\" y=\"{{ px.y }}\" width=\"1\" height=\"1\" fill=\"{{ px.color }}\"><\u002Frect><\u002Fsc-for><\u002Fsvg>\n    <sc-if value=\"{{ studyChrome }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:inline-flex;align-items:center;gap:7px;background:#ffffff;border:1px solid #e6d9f0;border-radius:20px;padding:6px 14px\">\n      <span style=\"width:8px;height:8px;border-radius:50%;background:#ff8fb0\"><\u002Fspan>\n      <span class=\"px\" style=\"font-size:9px;letter-spacing:.05em;color:#7a5c8a\">STUDYING TOGETHER<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:14px;margin-top:24px\">\n      <div style=\"text-align:center\">\n        <div style=\"width:56px;height:56px;border-radius:20px;background:#bcd4f5;color:#16324e;display:flex;align-items:center;justify-content:center;font-family:'Doto';font-weight:900;font-size:18px;box-shadow:0 6px 0 #a3c1ea\">YOU<\u002Fdiv>\n        <div style=\"font:600 11px 'Space Grotesk';color:#6b8299;margin-top:8px\">You<\u002Fdiv>\n      <\u002Fdiv>\n      <svg class=\"imgpx\" sc-camel-view-box=\"0 0 8 8\" width=\"28\" height=\"28\" shape-rendering=\"crispEdges\" style=\"animation:dv-bob 2.2s ease-in-out infinite\"><sc-for list=\"{{ studyHeart }}\" as=\"px\" hint-placeholder-count=\"16\"><rect x=\"{{ px.x }}\" y=\"{{ px.y }}\" width=\"1\" height=\"1\" fill=\"{{ px.color }}\"><\u002Frect><\u002Fsc-for><\u002Fsvg>\n      <div style=\"text-align:center\">\n        <div style=\"width:56px;height:56px;border-radius:20px;background:#c4e6bf;color:#16324e;display:flex;align-items:center;justify-content:center;font-family:'Doto';font-weight:900;font-size:18px;box-shadow:0 6px 0 #aad3a3\">{{ studyInit }}<\u002Fdiv>\n        <div style=\"font:600 11px 'Space Grotesk';color:#6b8299;margin-top:8px\">{{ studyName }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ studySetup }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;width:100%\">\n        <div style=\"font:400 13px/1.5 'Space Grotesk';color:#9fb6d0;max-width:230px\">Agree on a break time. When it's up, you'll play a quick game together.<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:18px\">\n          <button sc-camel-on-click=\"{{ decBreak }}\" style=\"width:44px;height:44px;border-radius:14px;border:2px solid #cdb8e6;background:#fff;color:#16324e;font-size:22px;cursor:pointer\">−<\u002Fbutton>\n          <div style=\"text-align:center;min-width:96px\"><span class=\"px\" style=\"font-size:22px;color:#2563eb\">{{ breakLabel }}<\u002Fspan><div style=\"font:500 11px 'Space Grotesk';color:#9fb6d0;margin-top:4px\">break after<\u002Fdiv><\u002Fdiv>\n          <button sc-camel-on-click=\"{{ incBreak }}\" style=\"width:44px;height:44px;border-radius:14px;border:2px solid #cdb8e6;background:#fff;color:#16324e;font-size:22px;cursor:pointer\">+<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ startFocus }}\" style=\"width:100%;border:none;background:#2f5f9e;color:#eaf3ec;padding:16px;border-radius:30px;font:600 15px 'Space Grotesk';cursor:pointer\">Start focusing together<\u002Fbutton>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ studyFocus }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;width:100%\">\n        <div style=\"font:500 11px 'Space Grotesk';color:#9fb6d0;letter-spacing:.04em\">BREAK IN<\u002Fdiv>\n        <div style=\"background:#ffffff;border:1px solid #e3ebf5;border-radius:24px;padding:16px 32px;box-shadow:0 8px 0 #e4ecf6\"><div class=\"px\" style=\"font-size:38px;color:#2563eb\">{{ breakIn }}<\u002Fdiv><\u002Fdiv>\n        <div style=\"font:400 13px/1.5 'Space Grotesk';color:#9fb6d0;max-width:230px\">Focusing with {{ studyName }} — heads down. 💕<\u002Fdiv>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ endStudy }}\" style=\"width:100%;border:none;background:#2f5f9e;color:#eaf3ec;padding:16px;border-radius:30px;font:600 15px 'Space Grotesk';cursor:pointer\">End session<\u002Fbutton>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ studyBreak }}\" hint-placeholder-val=\"{{ false }}\">\n\n      <sc-if value=\"{{ breakApproval }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;width:100%\">\n          <div class=\"px\" style=\"font-size:13px;color:#7a5c8a\">BREAK TIME!<\u002Fdiv>\n          <div style=\"font:400 13px/1.5 'Space Grotesk';color:#9fb6d0;max-width:240px;text-align:center\">You've hit your agreed break. Both of you need to approve before the game starts.<\u002Fdiv>\n          <div style=\"display:flex;gap:12px\">\n            <div style=\"text-align:center\">\n              <div style=\"width:56px;height:56px;border-radius:18px;background:{{ myBreakBg }};color:#16324e;display:flex;align-items:center;justify-content:center;font-family:'Doto';font-weight:900;font-size:18px\">{{ myMark }}<\u002Fdiv>\n              <div style=\"font:600 10px 'Space Grotesk';color:#9fb6d0;margin-top:6px\">{{ myLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"text-align:center\">\n              <div style=\"width:56px;height:56px;border-radius:18px;background:{{ foeBreakBg }};color:#16324e;display:flex;align-items:center;justify-content:center;font-family:'Doto';font-weight:900;font-size:18px\">{{ foeMark }}<\u002Fdiv>\n              <div style=\"font:600 10px 'Space Grotesk';color:#9fb6d0;margin-top:6px\">{{ foeLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ approveBreak }}\" disabled=\"{{ myBreakOk }}\" style=\"width:100%;border:none;background:{{ approveBg }};color:#eaf3ec;padding:16px;border-radius:30px;font:600 15px 'Space Grotesk';cursor:pointer\">{{ approveLabel }}<\u002Fbutton>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ gameChooser }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;width:100%\">\n          <div class=\"px\" style=\"font-size:12px;color:#7a5c8a\">BREAK TIME — PICK A GAME<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ pickHangman }}\" style=\"width:100%;border:3px solid #cdb8e6;background:#fff;color:#16324e;border-radius:18px;padding:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px\">\n            <span class=\"px\" style=\"font-size:13px;color:#7a5c8a\">HANGMAN<\u002Fspan>\n            <span style=\"font:400 12px 'Space Grotesk';color:#6b7a8f\">Guess the word — one picks, one guesses<\u002Fspan>\n          <\u002Fbutton>\n          <button sc-camel-on-click=\"{{ pickShoot }}\" style=\"width:100%;border:3px solid #f0a9a9;background:#fff;color:#16324e;border-radius:18px;padding:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px\">\n            <span class=\"px\" style=\"font-size:13px;color:#c24a4a\">SHOOTOUT<\u002Fspan>\n            <span style=\"font:400 12px 'Space Grotesk';color:#6b7a8f\">Quick-draw duel — fastest tap wins<\u002Fspan>\n          <\u002Fbutton>\n          <button sc-camel-on-click=\"{{ pickPac }}\" style=\"width:100%;border:3px solid #f5d76e;background:#fff;color:#16324e;border-radius:18px;padding:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px\">\n            <span class=\"px\" style=\"font-size:13px;color:#caa300\">PAC-MAN<\u002Fspan>\n            <span style=\"font:400 12px 'Space Grotesk';color:#6b7a8f\">Two players run from the ghost<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ backToFocus }}\" style=\"width:100%;border:none;background:#2f5f9e;color:#eaf3ec;padding:14px;border-radius:30px;font:600 14px 'Space Grotesk';cursor:pointer\">Back to focus<\u002Fbutton>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ gameHmPick }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;width:100%\">\n          <div class=\"px\" style=\"font-size:12px;color:#7a5c8a\">SET THE WORD<\u002Fdiv>\n          <div style=\"font:400 13px/1.5 'Space Grotesk';color:#9fb6d0;max-width:240px;text-align:center\">One of you types a word for the other to guess. Leave blank for a random word.<\u002Fdiv>\n          <input value=\"{{ hmCustomVal }}\" sc-camel-on-change=\"{{ setHmCustom }}\" placeholder=\"type a word\" sc-camel-max-length=\"12\" style=\"width:100%;box-sizing:border-box;background:#fff;border:2px solid #cdb8e6;color:#16324e;border-radius:12px;padding:14px;font-family:'Press Start 2P',monospace;font-size:11px;outline:none;text-transform:uppercase\">\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:10px;width:100%\">\n          <button sc-camel-on-click=\"{{ backToChooser }}\" style=\"flex:1;border:2px solid #cdb8e6;background:none;color:#7a5c8a;padding:14px;border-radius:30px;font:600 14px 'Space Grotesk';cursor:pointer\">Back<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ startHangman }}\" style=\"flex:1;border:none;background:#2f5f9e;color:#eaf3ec;padding:14px;border-radius:30px;font:600 14px 'Space Grotesk';cursor:pointer\">Play<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ gameHmPlay }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"flex:1;overflow-y:auto;width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:8px\">\n          <svg class=\"imgpx\" sc-camel-view-box=\"0 0 8 12\" width=\"70\" height=\"105\" shape-rendering=\"crispEdges\"><sc-for list=\"{{ hangman.cells }}\" as=\"px\" hint-placeholder-count=\"22\"><rect x=\"{{ px.x }}\" y=\"{{ px.y }}\" width=\"1\" height=\"1\" fill=\"{{ px.color }}\"><\u002Frect><\u002Fsc-for><\u002Fsvg>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap;justify-content:center\">\n            <sc-for list=\"{{ hangman.slots }}\" as=\"s\" hint-placeholder-count=\"5\">\n              <span class=\"px\" style=\"font-size:20px;color:{{ s.color }};border-bottom:3px solid #4a6a8f;width:16px;text-align:center\">{{ s.ch }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font:700 13px 'Space Grotesk';color:{{ hangman.statusColor }};text-align:center\">{{ hangman.status }}<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:5px;width:100%\">\n            <sc-for list=\"{{ hangman.letters }}\" as=\"l\" hint-placeholder-count=\"26\">\n              <button sc-camel-on-click=\"{{ l.guess }}\" disabled=\"{{ l.disabled }}\" style=\"aspect-ratio:1;border:none;border-radius:7px;background:{{ l.bg }};color:{{ l.fg }};font:700 12px 'Space Grotesk';cursor:pointer;box-shadow:0 3px 0 #dfe7f1\">{{ l.ch }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:10px;width:100%;margin-top:10px\">\n          <button sc-camel-on-click=\"{{ backToChooser }}\" style=\"flex:1;border:2px solid #cdb8e6;background:none;color:#7a5c8a;padding:14px;border-radius:30px;font:600 14px 'Space Grotesk';cursor:pointer\">New game<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ backToFocus }}\" style=\"flex:1;border:none;background:#2f5f9e;color:#eaf3ec;padding:14px;border-radius:30px;font:600 14px 'Space Grotesk';cursor:pointer\">Back to focus<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ gamePac }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 4px\">\n            <div style=\"display:flex;align-items:center;gap:6px;font:600 11px 'Space Grotesk';color:#dfe9f5\"><span style=\"width:12px;height:12px;border-radius:50%;background:#f5d000\"><\u002Fspan>You <span style=\"width:12px;height:12px;border-radius:50%;background:#4ce06a;margin-left:6px\"><\u002Fspan>{{ studyName }}<\u002Fdiv>\n            <div class=\"px\" style=\"font-size:11px;color:#caa300\">DOTS {{ pac.score }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat({{ pac.cols }},1fr);gap:2px;width:100%;max-width:280px;aspect-ratio:1;background:#0f2438;padding:4px;border-radius:10px\">\n            <sc-for list=\"{{ pac.grid }}\" as=\"c\" hint-placeholder-count=\"81\">\n              <div style=\"background:{{ c.bg }};border-radius:2px;display:flex;align-items:center;justify-content:center\">\n                <sc-if value=\"{{ c.dot }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:24%;height:24%;border-radius:50%;background:#f3e6b0\"><\u002Fspan><\u002Fsc-if>\n                <sc-if value=\"{{ c.who }}\" hint-placeholder-val=\"{{ false }}\"><svg class=\"imgpx\" sc-camel-view-box=\"0 0 8 8\" width=\"100%\" height=\"100%\" shape-rendering=\"crispEdges\"><sc-for list=\"{{ c.sprite }}\" as=\"px\" hint-placeholder-count=\"24\"><rect x=\"{{ px.x }}\" y=\"{{ px.y }}\" width=\"1\" height=\"1\" fill=\"{{ px.color }}\"><\u002Frect><\u002Fsc-for><\u002Fsvg><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font:700 12px 'Space Grotesk';color:{{ pac.statusColor }};text-align:center\">{{ pac.status }}<\u002Fdiv>\n          <sc-if value=\"{{ pac.over }}\" hint-placeholder-val=\"{{ false }}\">\n            <button sc-camel-on-click=\"{{ pac.restart }}\" style=\"border:none;background:#2f5f9e;color:#eaf3ec;padding:12px 22px;border-radius:24px;font:700 13px 'Space Grotesk';cursor:pointer\">Play again<\u002Fbutton>\n          <\u002Fsc-if>\n          <div style=\"display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);gap:6px;justify-content:center\">\n            <button sc-camel-on-click=\"{{ pac.up }}\" style=\"grid-column:2;grid-row:1;border:none;border-radius:12px;background:#f5d000;color:#3a2f00;font-size:18px;cursor:pointer;box-shadow:0 3px 0 #c9ab00\">▲<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ pac.left }}\" style=\"grid-column:1;grid-row:2;border:none;border-radius:12px;background:#f5d000;color:#3a2f00;font-size:18px;cursor:pointer;box-shadow:0 3px 0 #c9ab00\">◀<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ pac.down }}\" style=\"grid-column:2;grid-row:2;border:none;border-radius:12px;background:#f5d000;color:#3a2f00;font-size:18px;cursor:pointer;box-shadow:0 3px 0 #c9ab00\">▼<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ pac.right }}\" style=\"grid-column:3;grid-row:2;border:none;border-radius:12px;background:#f5d000;color:#3a2f00;font-size:18px;cursor:pointer;box-shadow:0 3px 0 #c9ab00\">▶<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:10px;width:100%\">\n          <button sc-camel-on-click=\"{{ backToChooser }}\" style=\"flex:1;border:2px solid #cdb8e6;background:none;color:#7a5c8a;padding:14px;border-radius:30px;font:600 14px 'Space Grotesk';cursor:pointer\">Games<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ backToFocus }}\" style=\"flex:1;border:none;background:#2f5f9e;color:#eaf3ec;padding:14px;border-radius:30px;font:600 14px 'Space Grotesk';cursor:pointer\">Back to focus<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ gameShoot }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;width:100%\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 8px\">\n            <div style=\"text-align:center\"><div class=\"px\" style=\"font-size:18px;color:#2563eb\">{{ shoot.my }}<\u002Fdiv><div style=\"font:600 10px 'Space Grotesk';color:#9fb6d0\">You<\u002Fdiv><\u002Fdiv>\n            <div class=\"px\" style=\"font-size:10px;color:#9fb6d0\">FIRST TO 3<\u002Fdiv>\n            <div style=\"text-align:center\"><div class=\"px\" style=\"font-size:18px;color:#c24a4a\">{{ shoot.foe }}<\u002Fdiv><div style=\"font:600 10px 'Space Grotesk';color:#9fb6d0\">{{ shoot.foeName }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ shoot.ready }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"font:400 13px/1.5 'Space Grotesk';color:#9fb6d0;text-align:center;max-width:220px\">Wait for <b style=\"color:#c24a4a\">FIRE!<\u002Fb> then tap as fast as you can. Tap early and you lose the point.<\u002Fdiv>\n            <button sc-camel-on-click=\"{{ shoot.start }}\" style=\"width:100%;border:none;background:#2f5f9e;color:#eaf3ec;padding:18px;border-radius:20px;font:700 16px 'Space Grotesk';cursor:pointer\">Draw!<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ shoot.waiting }}\" hint-placeholder-val=\"{{ false }}\">\n            <button sc-camel-on-click=\"{{ shoot.fire }}\" style=\"width:100%;border:none;background:#e9d9c2;color:#7a5c3a;padding:38px;border-radius:20px;font:700 18px 'Space Grotesk';cursor:pointer\">Wait for it…<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ shoot.draw }}\" hint-placeholder-val=\"{{ false }}\">\n            <button sc-camel-on-click=\"{{ shoot.fire }}\" style=\"width:100%;border:none;background:#c24a4a;color:#fff;padding:38px;border-radius:20px;font:900 26px 'Space Grotesk';letter-spacing:.05em;cursor:pointer\">FIRE!<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ shoot.result }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font:700 15px/1.4 'Space Grotesk';color:#dfe9f5;text-align:center;max-width:240px\">{{ shoot.msg }}<\u002Fdiv>\n            <sc-if value=\"{{ shoot.over }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"px\" style=\"font-size:12px;color:#2563eb;text-align:center\">{{ shoot.overText }}<\u002Fdiv><\u002Fsc-if>\n            <button sc-camel-on-click=\"{{ shoot.next }}\" style=\"width:100%;border:none;background:#2f5f9e;color:#eaf3ec;padding:16px;border-radius:20px;font:700 15px 'Space Grotesk';cursor:pointer\">{{ shoot.nextLabel }}<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:10px;width:100%\">\n          <button sc-camel-on-click=\"{{ backToChooser }}\" style=\"flex:1;border:2px solid #cdb8e6;background:none;color:#7a5c8a;padding:14px;border-radius:30px;font:600 14px 'Space Grotesk';cursor:pointer\">Games<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ backToFocus }}\" style=\"flex:1;border:none;background:#2f5f9e;color:#eaf3ec;padding:14px;border-radius:30px;font:600 14px 'Space Grotesk';cursor:pointer\">Back to focus<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ SCREEN 5 : OPEN ANYWAY (button roams) ============ -->\n  <sc-if value=\"{{ isAway }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"scr\" style=\"padding:56px 24px 24px;background:#0a0a0a;position:relative\">\n    <sc-if value=\"{{ away.opened }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:20px\">\n        <div class=\"px\" style=\"font-size:30px;color:#f4f2ee\">OK<\u002Fdiv>\n        <div style=\"font:400 15px/1.5 'Space Grotesk';color:#999;max-width:220px\">Opening Instagram. You chose this on purpose — that's the whole point.<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ goBreathe }}\" style=\"border:1px solid #333;background:none;color:#888;padding:12px 20px;border-radius:30px;font:500 13px 'Space Grotesk';cursor:pointer\">Restart demo<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ away.reason }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"px\" style=\"font-size:9px;color:#d4322b\">ONE LAST THING<\u002Fdiv>\n      <div style=\"font-family:'Doto';font-weight:600;font-size:30px;line-height:1.05;margin-top:14px\">Why are you<br>opening it?<\u002Fdiv>\n      <div style=\"font:400 13px/1.5 'Space Grotesk';color:#888;margin-top:14px;max-width:250px\">Name the real reason. If there's a good one, go ahead.<\u002Fdiv>\n      <textarea value=\"{{ away.reasonVal }}\" sc-camel-on-change=\"{{ away.setReason }}\" placeholder=\"e.g. reply to Mara about the trip plans\" rows=\"3\" style=\"width:100%;box-sizing:border-box;resize:none;background:#111;border:1.5px solid #2a2a2a;color:#f4f2ee;border-radius:14px;padding:14px;font:400 15px/1.4 'Space Grotesk';outline:none;margin-top:20px\"><\u002Ftextarea>\n      <button sc-camel-on-click=\"{{ away.confirmOpen }}\" disabled=\"{{ away.openLocked }}\" style=\"margin-top:16px;width:100%;border:none;background:{{ away.openBg }};color:{{ away.openFg }};padding:16px;border-radius:30px;font:600 15px 'Space Grotesk';cursor:pointer\">Open Instagram<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ goInstead }}\" style=\"margin-top:12px;width:100%;border:1px solid #2a2a2a;background:none;color:#888;padding:14px;border-radius:30px;font:500 13px 'Space Grotesk';cursor:pointer\">Never mind — show options<\u002Fbutton>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ away.ask }}\" hint-placeholder-val=\"{{ true }}\">\n      <div class=\"px\" style=\"font-size:9px;color:#d4322b\">HOLD ON<\u002Fdiv>\n      <div style=\"font-family:'Doto';font-weight:600;font-size:30px;line-height:1.05;margin-top:14px\">Are you sure<br>this is on<br>purpose?<\u002Fdiv>\n      <div style=\"font:400 13px/1.5 'Space Grotesk';color:#888;margin-top:14px;max-width:250px\">The open button moves every time you come here, so you notice the habit instead of tapping on autopilot. Visit #{{ away.visits }}.<\u002Fdiv>\n      <button sc-camel-on-click=\"{{ goInstead }}\" style=\"margin-top:26px;width:100%;border:none;background:#f4f2ee;color:#0a0a0a;padding:17px;border-radius:30px;font:600 15px 'Space Grotesk';cursor:pointer\">No — show me options<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ openInsta }}\" style=\"position:absolute;border:1.5px solid #2a2a2a;background:none;color:#777;padding:13px 18px;border-radius:30px;font:500 13px 'Space Grotesk';cursor:pointer;left:{{ away.left }}px;top:{{ away.top }}px;transition:left .25s ease,top .25s ease\">Open anyway<\u002Fbutton>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:820},&quot;starCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:140,&quot;min&quot;:0,&quot;max&quot;:220,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Night sky&quot;,&quot;label&quot;:&quot;Number of stars&quot;},&quot;darker&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Night sky&quot;,&quot;label&quot;:&quot;Darker night&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    this.state = {\n      screen:\"instead\", secs:30, soundOn:true, showReal:true,\n      detail:null,\n      customs:[],\n      paint:{}, color:\"#f5d000\", drawing:false, editName:\"\",\n      awayLeft:40, awayTop:360, awayVisits:0, opened:false, reasoning:false, awayReason:\"\",\n      search:\"\", adding:null, addDesc:\"\", editDesc:\"\", editStep:\"draw\",\n      actMin:10, actLeft:0, actRunning:false, theme:(()=>{const h=new Date().getHours();return (h>=20||h<5)?\"dark\":\"light\";})(),\n      studyWith:\"Mara\", studyElapsed:0, studyPhase:\"break\", breakMin:25, notif:null,\n      walkPosts:[\n        {id:\"w1\", place:\"Riverside trail\", by:\"Mara\", tip:\"Flat & shady \\u2014 good for a slow one\"},\n        {id:\"w2\", place:\"Cherry blossom park\", by:\"Jude\", tip:\"Go at sunrise, barely anyone there\"},\n        {id:\"w3\", place:\"Old town rooftop loop\", by:\"Peng\", tip:\"Steep but the view is worth it\"},\n      ],\n      supportPosts:[\n        {id:\"s1\", text:\"I open Instagram the second I feel bored at work. It's automatic and I hate it.\", tag:\"habit\", supports:23, sent:false, reqState:\"none\", ageOk:true, irl:false},\n        {id:\"s2\", text:\"Doomscrolling at 2am again. I know it makes my anxiety worse but I can't stop.\", tag:\"stress\", supports:41, sent:false, reqState:\"none\", ageOk:true, irl:false},\n        {id:\"s3\", text:\"Deleted the app three times this month and reinstalled it every time.\", tag:\"struggle\", supports:18, sent:false, reqState:\"none\", ageOk:false, irl:false},\n        {id:\"s4\", text:\"One small win: I read a whole chapter instead of scrolling tonight.\", tag:\"win\", supports:57, sent:false, reqState:\"none\", ageOk:true, irl:true},\n      ],\n      gate:null,\n      bookPosts:[\n        {id:\"b1\", title:\"The Midnight Library\", author:\"Matt Haig\", by:\"Mara\", note:\"Easy read, big feelings\"},\n        {id:\"b2\", title:\"Educated\", author:\"Tara Westover\", by:\"Jude\", note:\"Couldn't put it down\"},\n        {id:\"b3\", title:\"Piranesi\", author:\"Susanna Clarke\", by:\"Peng\", note:\"Strange & calming\"},\n      ],\n      hmWord:\"\", hmGuessed:[], hmWrong:0, breakGame:null, hmCustom:\"\",\n      sPhase:\"ready\", sMy:0, sFoe:0, sMsg:\"\", myBreakOk:true, foeBreakOk:true, pac:null,\n      nudged:{},\n    };\n  }\n\n  componentDidMount(){\n    this._t = setInterval(()=>{\n      this.setState(st => {\n        const patch = {};\n        if(st.screen===\"breathe\" && st.secs>0) patch.secs = st.secs-1;\n        if(st.actRunning && st.actLeft>0){ patch.actLeft = st.actLeft-1; if(st.actLeft-1<=0) patch.actRunning=false; }\n        if(st.screen===\"study\" && st.studyPhase===\"focus\"){\n          const e = st.studyElapsed+1;\n          patch.studyElapsed = e;\n          if(e >= st.breakMin*60){ patch.studyPhase=\"break\"; patch.breakGame=null; patch.myBreakOk=false; patch.foeBreakOk=false; }\n        }\n        return Object.keys(patch).length ? patch : null;\n      });\n    }, 1000);\n    this._notif = setTimeout(()=>{\n      this.setState({notif:{name:\"Mara\", init:\"MR\", msg:\"Hey! Saw your screen time's up today \\u2014 want to swap phones for books tonight? \\u{1F49b}\"}});\n    }, 4000);\n  }\n  componentWillUnmount(){ clearTimeout(this._notif); clearInterval(this._t); clearTimeout(this._sDraw); this.stopPac(); this.stopBreathAudio(); }\n\n  // ---- gentle breathing chime (WebAudio, no assets) ----\n  chime(rising){\n    try{\n      if(!this._ac) this._ac = new (window.AudioContext||window.webkitAudioContext)();\n      const ac=this._ac; if(ac.state===\"suspended\") ac.resume();\n      const o=ac.createOscillator(), g=ac.createGain();\n      o.type=\"sine\"; o.connect(g); g.connect(ac.destination);\n      const t=ac.currentTime, f0=rising?196:294, f1=rising?294:196;\n      o.frequency.setValueAtTime(f0,t); o.frequency.linearRampToValueAtTime(f1,t+3.4);\n      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.14,t+0.6);\n      g.gain.linearRampToValueAtTime(0.001,t+3.6);\n      o.start(t); o.stop(t+3.8);\n    }catch(e){}\n  }\n  startBreathAudio(){\n    this.stopBreathAudio();\n    if(!(this.state.soundOn)) return;\n    this.chime(true);\n    this._ex = setTimeout(()=>this.chime(false), 4500);\n    this._cy = setInterval(()=>{ this.chime(true); setTimeout(()=>this.chime(false),4500); }, 9000);\n  }\n  stopBreathAudio(){ clearInterval(this._cy); clearTimeout(this._ex); this._cy=null; }\n  toggleSound(){\n    this.setState(s=>{\n      const on=!s.soundOn;\n      if(on && s.screen===\"breathe\") setTimeout(()=>this.startBreathAudio(),0); else this.stopBreathAudio();\n      return {soundOn:on};\n    });\n  }\n\n  // ---- pac-man (two players run from a ghost) ----\n  stopPac(){ clearInterval(this._pac); this._pac=null; }\n  dist(a,b){ return Math.abs(a.x-b.x)+Math.abs(a.y-b.y); }\n  startPac(){\n    const M=[\"#########\",\"#.......#\",\"#.##.##.#\",\"#.#...#.#\",\"#...#...#\",\"#.#...#.#\",\"#.##.##.#\",\"#.......#\",\"#########\"];\n    const p1={x:1,y:1}, p2={x:7,y:7}, g={x:4,y:3};\n    const dots=[];\n    for(let y=0;y<M.length;y++) for(let x=0;x<M[0].length;x++){\n      if(M[y][x]!==\"#\"){ const k=x+\",\"+y; if(!(x===p1.x&&y===p1.y)&&!(x===p2.x&&y===p2.y)&&!(x===g.x&&y===g.y)) dots.push(k); }\n    }\n    this.stopPac();\n    this.setState({breakGame:\"pac\", pac:{M,p1,p2,g,dir:{x:0,y:0},dir2:{x:0,y:0},dots,status:\"play\",score:0}});\n    this._pac=setInterval(()=>this.pacTick(),220);\n  }\n  aiMove(pos,ghost,M,wall,dots){\n    const opts=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}].map(d=>({x:pos.x+d.x,y:pos.y+d.y}))\n      .filter(n=>!wall(n.x,n.y));\n    if(!opts.length) return pos;\n    let best=opts[0], bs=-1e9;\n    opts.forEach(n=>{ let s=this.dist(n,ghost)*2 + (dots.includes(n.x+\",\"+n.y)?3:0) + Math.random(); if(s>bs){bs=s;best=n;} });\n    return best;\n  }\n  ghostMove(g,pacs,M,wall){\n    const opts=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}].map(d=>({x:g.x+d.x,y:g.y+d.y}))\n      .filter(n=>!wall(n.x,n.y));\n    if(!opts.length) return g;\n    const near=pacs.reduce((a,p)=> this.dist(g,p)<this.dist(g,a)?p:a, pacs[0]);\n    let best=opts[0], bs=1e9;\n    opts.forEach(n=>{ const s=this.dist(n,near)+Math.random()*0.4; if(s<bs){bs=s;best=n;} });\n    return best;\n  }\n  pacTick(){\n    this.setState(s=>{\n      const p=s.pac; if(!p||p.status!==\"play\") return null;\n      const M=p.M, W=M[0].length, H=M.length;\n      const wall=(x,y)=> x<0||y<0||x>=W||y>=H||M[y][x]===\"#\";\n      let p1={...p.p1}; const nx=p1.x+p.dir.x, ny=p1.y+p.dir.y; if((p.dir.x||p.dir.y)&&!wall(nx,ny)) p1={x:nx,y:ny};\n      const p2=this.aiMove(p.p2,p.g,M,wall,p.dots);\n      let dots=p.dots.filter(k=> k!==p1.x+\",\"+p1.y && k!==p2.x+\",\"+p2.y);\n      const eaten=p.dots.length-dots.length;\n      const g=this.ghostMove(p.g,[p1,p2],M,wall);\n      const hit=(a,b)=>a.x===b.x&&a.y===b.y;\n      let status=\"play\";\n      if(hit(g,p1)||hit(g,p2)) status=\"lost\";\n      else if(dots.length===0) status=\"win\";\n      if(status!==\"play\") this.stopPac();\n      return {pac:{...p,p1,p2,g,dir:p.dir,dir2:p.dir2,dots,score:p.score+eaten,status}};\n    });\n  }\n  setDir(x,y){ this.setState(s=> s.pac ? {pac:{...s.pac,dir:{x,y}}} : null); }\n  setDir2(x,y){ this.setState(s=> s.pac ? {pac:{...s.pac,dir2:{x,y}}} : null); }\n\n  // ---- shootout (quick-draw duel) ----\n  sStart(){\n    clearTimeout(t \\u{1F50A} sound on\" : \"\\u{1F507} sound off\",\n      toggleSound: () => this.toggleSound(),\n      isInstead: scr===\"instead\" && !st.detail,\n      isSteps:   scr===\"instead\" && !!st.detail,\n      closeSteps:() => this.setState({detail:null}),\n      steps: st.detail ? {name:st.detail.name, unit:st.detail.unit, list:st.detail.steps||[]} : null,\n      stepsIsWalk: !!(st.detail && st.detail.name===\"WALK\"),\n      stepsIsRead: !!(st.detail && st.detail.name===\"READ\"),\n      isBooks: scr===\"books\",\n      bookPosts: st.bookPosts,\n      goBooks: () => this.setState({screen:\"books\"}),\n      backFromBooks: () => this.setState({screen:\"instead\", detail:null}),\n      addBookPost: () => {\n        const title = window.prompt(\"Book title?\");\n        if(title && title.trim()){\n          const author = window.prompt(\"Author?\") || \"\";\n          const note = window.prompt(\"A quick why (optional)\") || \"\";\n          this.setState(s=>({bookPosts:[{id:\"b\"+Date.now(), title:title.trim(), author:author.trim(), by:\"You\", note:note.trim()}, ...s.bookPosts]}));\n        }\n      },\n      stepsTheme: (st.detail && st.detail.name===\"WALK\")\n        ? {bg:\"linear-gradient(#d7e7f0,#e6efe0)\", ink:\"#16324e\", muted:\"#5a7690\", kicker:\"#5b8c5a\", cardBg:\"#ffffff\", cardBorder:\"#d3e0ef\", num:\"#5b8c5a\", stepText:\"#46586b\", label:\"#5b8c5a\", ctrlBorder:\"#cdd9e6\", ctrlFg:\"#16324e\", minColor:\"#2f6a4f\", doneBg:\"#16324e\", doneFg:\"#eaf3ec\", backBorder:\"#bcd0e6\", backFg:\"#5a7690\"}\n        : {bg:\"#0a0a0a\", ink:\"#f4f2ee\", muted:\"#999\", kicker:\"#d4322b\", cardBg:\"#111\", cardBorder:\"#222\", num:\"#d4322b\", stepText:\"#ddd\", label:\"#3b82f6\", ctrlBorder:\"#333\", ctrlFg:\"#f4f2ee\", minColor:\"#93c5fd\", doneBg:\"#f4f2ee\", doneFg:\"#0a0a0a\", backBorder:\"#333\", backFg:\"#888\"},\n      isWalk: scr===\"walk\",\n      walkPosts: st.walkPosts,\n      goWalk: () => this.setState({screen:\"walk\"}),\n      walkLamp: this.colorSprite([\n        \".GGGG.\",\n        \"GGGGGG\",\n        \"GGGGGG\",\n        \".GGGG.\",\n        \"..PP..\",\n        \"..PP..\",\n        \"..PP..\",\n        \"..PP..\",\n        \"..PP..\",\n        \"..PP..\",\n        \".PPPP.\",\n        \"PPPPPP\"], {G:\"#ffd85e\",P:\"#46586b\"}),\n      walkTree: this.colorSprite([\n        \"..GGGG..\",\n        \".GGGGGG.\",\n        \"GGGGGGGG\",\n        \"GGGGGGGG\",\n        \".GGGGGG.\",\n        \"...TT...\",\n        \"...TT...\",\n        \"...TT...\"], {G:\"#6fae6d\",T:\"#7a5636\"}),\n      walkPlant: this.spriteCells(\"plant\",\"#5b8c5a\"),\n      walkSteve: this.colorSprite([\n        \"HHHHHH\",\n        \"SSSSSS\",\n        \"SWSSWS\",\n        \"SSSSSS\",\n        \"ACCCCA\",\n        \"ACCCCA\",\n        \"ACCCCA\",\n        \"LLLLLL\",\n        \"LL..LL\",\n        \"LL..LL\"], {H:\"#3a2a18\",S:\"#c8956b\",W:\"#26304a\",C:\"#2aa5a0\",A:\"#c8956b\",L:\"#31507e\"}),\n      backFromWalk: () => this.setState({screen:\"instead\", detail:null}),\n      addWalkPost: () => {\n        const place = window.prompt(\"Where did you walk? (name the spot)\");\n        if(place && place.trim()){\n          const tip = window.prompt(\"A quick suggestion for others (optional)\") || \"\";\n          this.setState(s=>({walkPosts:[{id:\"w\"+Date.now(), place:place.trim(), by:\"You\", tip:tip.trim()}, ...s.walkPosts]}));\n        }\n      },\n      timer: (()=>{\n        const started = st.actRunning || st.actLeft>0;\n        const secs = started ? st.actLeft : st.actMin*60;\n        const mm = String(Math.floor(secs/60)).padStart(2,\"0\");\n        const ss = String(secs%60).padStart(2,\"0\");\n        const doneT = started && st.actLeft<=0 && !st.actRunning;\n        return {\n          idle: !started, active: started,\n          minLabel: st.actMin, mmss: mm+\":\"+ss, done: doneT, tColor: doneT ? \"#38d15a\" : \"#93c5fd\",\n          pauseLabel: st.actRunning ? \"Pause\" : \"Resume\",\n          dec: () => this.setState(s=>({actMin: Math.max(5, s.actMin-5)})),\n          inc: () => this.setState(s=>({actMin: Math.min(120, s.actMin+5)})),\n          start: () => this.setState(s=>({actLeft: s.actMin*60, actRunning:true})),\n          pause: () => this.setState(s=>({actRunning: !s.actRunning})),\n          reset: () => this.setState({actRunning:false, actLeft:0}),\n        };\n      })(),\n      isEditor:  scr===\"editor\" && st.editStep===\"draw\",\n      isEditDesc: scr===\"editor\" && st.editStep===\"desc\",\n      isCommunity: scr===\"community\",\n      goCommunity: () => this.setState({screen:\"community\"}),\n      isStats: scr===\"stats\", stats, goStats: () => this.setState({screen:\"stats\"}),\n      isSupport: scr===\"support\",\n      goSupport: () => this.setState({screen:\"support\"}),\n      gate: st.gate,\n      closeGate: () => this.setState({gate:null}),\n      supportPosts: st.supportPosts.map(p => ({\n        id:p.id, text:p.text, tag:p.tag, supports:p.supports + (p.sent?1:0),\n        sentLabel: p.sent ? \"\\u{1F499} supported\" : \"Send support\",\n        sentBg: p.sent ? \"#2f5f9e\" : \"none\",\n        sentFg: p.sent ? \"#fff\" : \"#5a7690\",\n        reqLabel: p.reqState===\"sent\" ? \"Request sent\" : (p.reqState===\"blocked\" ? \"Can't connect\" : \"Add friend\"),\n        reqBg: p.reqState===\"sent\" ? \"#dbe7d4\" : \"none\",\n        support: () => this.setState(s=>({supportPosts:s.supportPosts.map(x=>x.id===p.id?{...x,sent:!x.sent}:x)})),\n        request: () => {\n          if(!p.ageOk){\n            this.setState(s=>({\n              gate:{ ageOk:p.ageOk },\n              supportPosts:s.supportPosts.map(x=>x.id===p.id?{...x,reqState:\"blocked\"}:x)\n            }));\n          } else {\n            this.setState(s=>({supportPosts:s.supportPosts.map(x=>x.id===p.id?{...x,reqState:\"sent\"}:x)}));\n          }\n        },\n      })),\n      addSupportPost: () => {\n        const text = window.prompt(\"Share anonymously (be kind — support only):\");\n        if(text && text.trim()){\n          this.setState(s=>({supportPosts:[{id:\"s\"+Date.now(), text:text.trim(), tag:\"struggle\", supports:0, sent:false, reqState:\"none\", ageOk:true, irl:false}, ...s.supportPosts]}));\n        }\n      },\n      isStudy: scr===\"study\",\n      studyName: st.studyWith,\n      studyTime: String(Math.floor(st.studyElapsed/60)).padStart(2,\"0\")+\":\"+String(st.studyElapsed%60).padStart(2,\"0\"),\n      studyInit: (st.studyWith||\"?\").slice(0,2).toUpperCase(),\n      endStudy: () => { this.stopPac(); this.setState({screen:\"friends\", studyWith:null, studyElapsed:0}); },\n      studyHeart: this.spriteCells(\"heart\", \"#ff8fb0\"),\n      studyPlant: this.spriteCells(\"plant\", \"#6fae6d\"),\n      studySetup: scr===\"study\" && st.studyPhase===\"setup\",\n      studyFocus: scr===\"study\" && st.studyPhase===\"focus\",\n      studyBreak: scr===\"study\" && st.studyPhase===\"break\",\n      breakLabel: st.breakMin + \" min\",\n      breakIn: (()=>{ const r=Math.max(0, st.breakMin*60 - st.studyElapsed); return String(Math.floor(r/60)).padStart(2,\"0\")+\":\"+String(r%60).padStart(2,\"0\"); })(),\n      incBreak: () => this.setState(s=>({breakMin: Math.min(60, s.breakMin+5)})),\n      decBreak: () => this.setState(s=>({breakMin: Math.max(5, s.breakMin-5)})),\n      startFocus: () => this.setState({studyPhase:\"focus\", studyElapsed:0}),\n      backToFocus: () => { this.stopPac(); this.setState({studyPhase:\"focus\", studyElapsed:0}); },\n      breakApproval: scr===\"study\" && st.studyPhase===\"break\" && !(st.myBreakOk && st.foeBreakOk),\n      myBreakBg: st.myBreakOk ? \"#c4e6bf\" : \"#e6edf5\",\n      myMark: st.myBreakOk ? \"\\u2713\" : \"YOU\",\n      myLabel: st.myBreakOk ? \"ready\" : \"you\",\n      foeBreakBg: st.foeBreakOk ? \"#c4e6bf\" : \"#e6edf5\",\n      foeMark: st.foeBreakOk ? \"\\u2713\" : (st.studyWith||\"?\").slice(0,2).toUpperCase(),\n      foeLabel: st.foeBreakOk ? \"ready\" : st.studyWith,\n      approveBg: st.myBreakOk ? \"#9db6c4\" : \"#16324e\",\n      approveLabel: st.myBreakOk ? \"Waiting for buddy\\u2026\" : \"I'm ready for break\",\n      approveBreak: () => {\n        this.setState({myBreakOk:true});\n        setTimeout(()=>this.setState({foeBreakOk:true}), 1300);   // friend approves\n      },\n      gameChooser: scr===\"study\" && st.studyPhase===\"break\" && st.breakGame===null && st.myBreakOk && st.foeBreakOk,\n      gameHmPick: st.breakGame===\"hmpick\",\n      gameHmPlay: st.breakGame===\"hmplay\",\n      gameShoot: st.breakGame===\"shoot\",\n      hmCustomVal: st.hmCustom,\n      setHmCustom: e => { const v=e.target.value; this.setState({hmCustom:v}); },\n      pickHangman: () => this.setState({breakGame:\"hmpick\", hmCustom:\"\"}),\n      pickShoot: () => this.setState({breakGame:\"shoot\", sPhase:\"ready\", sMy:0, sFoe:0, sMsg:\"\"}),\n      backToChooser: () => { this.stopPac(); this.setState({breakGame:null}); },\n      pickPac: () => this.startPac(),\n      gamePac: st.breakGame===\"pac\",\n      studyChrome: scr===\"study\" && !(st.breakGame===\"pac\"||st.breakGame===\"shoot\"||st.breakGame===\"hmplay\"),\n      pac: (()=>{\n        const P=st.pac; if(!P) return null;\n        const yellow=this.spriteCells(\"pac\",\"#f5d000\"), green=this.spriteCells(\"pac\",\"#4ce06a\"), ghostS=this.spriteCells(\"ghost\",\"#f2857f\");\n        const W=P.M[0].length, grid=[];\n        for(let y=0;y<P.M.length;y++) for(let x=0;x<W;x++){\n          const k=x+\",\"+y; let who=null, sprite=null;\n          if(P.g.x===x&&P.g.y===y){ who=\"ghost\"; sprite=ghostS; }\n          else if(P.p1.x===x&&P.p1.y===y){ who=\"p1\"; sprite=yellow; }\n          else if(P.p2.x===x&&P.p2.y===y){ who=\"p2\"; sprite=green; }\n          const wall=P.M[y][x]===\"#\";\n          grid.push({wall, dot:P.dots.includes(k), who, sprite, bg: wall ? \"#3f77c2\" : \"#0a1a2c\"});\n        }\n        const over=P.status!==\"play\";\n        return {\n          grid, cols:W, score:P.score, over, win:P.status===\"win\",\n          status: P.status===\"win\" ? \"You escaped with all the dots! \\u{1F389}\" : P.status===\"lost\" ? \"The ghost caught you!\" : \"Grab the dots \\u2014 run from the ghost\",\n          statusColor: P.status===\"win\" ? \"#7fe0a6\" : P.status===\"lost\" ? \"#f2857f\" : \"#dfe9f5\",\n          up:()=>this.setDir(0,-1), down:()=>this.setDir(0,1), left:()=>this.setDir(-1,0), right:()=>this.setDir(1,0),\n          up2:()=>this.setDir2(0,-1), down2:()=>this.setDir2(0,1), left2:()=>this.setDir2(-1,0), right2:()=>this.setDir2(1,0),\n          restart:()=>this.startPac(), nextLabel: \"\",\n        };\n      })(),\n      startHangman: () => {\n        const clean = (this.state.hmCustom||\"\").toUpperCase().replace(/[^A-Z]/g,\"\");\n        const WORDS=[\"FOCUS\",\"STUDY\",\"BREATHE\",\"GARDEN\",\"PIXEL\",\"FRIEND\",\"CALM\",\"SUNSET\",\"LIBRARY\",\"WALK\"];\n        const word = clean.length>=2 ? clean : WORDS[Math.floor(Math.random()*WORDS.length)];\n        this.setState({breakGame:\"hmplay\", hmWord:word, hmGuessed:[], hmWrong:0});\n      },\n      shoot: (()=>{\n        const over = st.sMy>=3 || st.sFoe>=3;\n        return {\n          phase: st.sPhase, msg: st.sMsg, my: st.sMy, foe: st.sFoe, foeName: st.studyWith, over,\n          ready: st.sPhase===\"ready\", waiting: st.sPhase===\"waiting\", draw: st.sPhase===\"draw\", result: st.sPhase===\"result\",\n          overText: st.sMy>=3 ? \"You win the duel! \\u{1F3C6}\" : ((st.studyWith||\"Friend\")+\" wins the duel\"),\n          start: ()=>this.sStart(),\n          fire: ()=>this.sFire(),\n          nextLabel: over ? \"Play again\" : \"Next round\",\n          next: ()=> over ? this.setState({sPhase:\"ready\", sMy:0, sFoe:0, sMsg:\"\"}) : this.sStart(),\n        };\n      })(),\n      hangman: (()=>{\n        const w = st.hmWord || \"\";\n        const won = w && w.split(\"\").every(c=>st.hmGuessed.includes(c));\n        const lost = st.hmWrong>=6;\n        const over = won || lost;\n        const letters = \"ABCDEFGHIJKLMNOPQRSTUVWXYZ\".split(\"\").map(ch=>{\n          const used = st.hmGuessed.includes(ch);\n          return { ch, used, disabled: used||over, guess: ()=>this.hmGuess(ch),\n            bg: used ? \"#d3e0ef\" : \"#ffffff\", fg: used ? \"#9db6c4\" : \"#16324e\" };\n        });\n        const slots = w.split(\"\").map(c=>{\n          const miss = lost && !st.hmGuessed.includes(c);\n          return { ch: (st.hmGuessed.includes(c)||lost) ? c : \"_\", miss, color: miss ? \"#f2a06a\" : \"#dfe9f5\" };\n        });\n        const status = won ? \"You saved it! \\u{1F389}\" : lost ? \"Out of guesses \\u2014 it was \"+w : \"Guess a letter \\u00b7 \"+(6-st.hmWrong)+\" left\";\n        const statusColor = won ? \"#7fe0a6\" : lost ? \"#f2a06a\" : \"#dfe9f5\";\n        const gallows=[[0,11],[1,11],[2,11],[3,11],[4,11],[1,10],[1,9],[1,8],[1,7],[1,6],[1,5],[1,4],[1,3],[1,2],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[6,2],[6,3]].map(([x,y])=>({x,y,color:\"#8a6a52\"}));\n        const parts=[[[5,4],[6,4],[7,4],[5,5],[6,5],[7,5]],[[6,6],[6,7],[6,8]],[[5,6]],[[7,6]],[[5,9]],[[7,9]]];\n        let fig=[]; for(let i=0;i<Math.min(st.hmWrong,6);i++) fig=fig.concat(parts[i].map(([x,y])=>({x,y,color:\"#16324e\"})));\n        return { letters, slots, status, statusColor, over, cells:[...gallows,...fig],\n          playAgain: ()=>this.setState(this.newGame()) };\n      })(),\n      isSearch:  scr===\"search\" && !st.adding,\n      isAdding:  scr===\"search\" && !!st.adding,\n      searchResults, adding, searchVal: st.search, descVal: st.addDesc,\n      setSearch: e => { const v=e.target.value; this.setState({search:v}); },\n      setDesc:   e => { const v=e.target.value; this.setState({addDesc:v}); },\n      cancelAdd: () => this.setState({adding:null, addDesc:\"\"}),\n      confirmAdd: () => {\n        const c = this.state.adding; if(!c) return;\n        const desc = (this.state.addDesc||\"\").trim();\n        const custom = { name:c.name, unit:c.unit, tag:\"added\", grid:8,\n          cells:this.spriteCells(c.sprite, c.ic),\n          bg:\"#0a0a0a\", fg:\"#f4f2ee\", border:c.border, dotAccent:c.border,\n          steps: desc ? [{n:1,t:desc}] : [{n:1,t:\"Do \"+c.name.toLowerCase()+\" — phone down.\"}] };\n        this.setState(s => ({ customs:[...s.customs, custom], adding:null, addDesc:\"\", search:\"\", screen:\"instead\" }));\n      },\n      goSearch:  () => this.go(\"search\"),\n      isFriends: scr===\"friends\",\n      isAway:    scr===\"away\",\n\n      // breathe\n      secsLabel,\n      breatheLocked: !done,\n      breatheBtnLabel: done ? \"Continue \\u2192\" : \"Keep breathing\\u2026 \"+st.secs+\"s\",\n      breatheBtnBg: done ? sky.btnBg : sky.lockBg,\n      breatheBtnFg: done ? sky.btnFg : sky.lockFg,\n      breatheCursor: done ? \"pointer\" : \"default\",\n\n      acts, pApps, friends, ed, ringCells, motif, sky, theme, themeIcon,\n      toggleTheme: () => this.setState(s=>({theme: s.theme===\"dark\" ? \"light\" : \"dark\"})), dots, moonCells,\n\n      away: {\n        ask: !st.opened && !st.reasoning,\n        reason: !st.opened && st.reasoning,\n        opened: st.opened,\n        left: st.awayLeft, top: st.awayTop, visits: st.awayVisits,\n        reasonVal: st.awayReason,\n        setReason: e => { const v=e.target.value; this.setState({awayReason:v}); },\n        openLocked: st.awayReason.trim().length <= 3,\n        openBg: st.awayReason.trim().length > 3 ? \"#d4322b\" : \"#222\",\n        openFg: st.awayReason.trim().length > 3 ? \"#fff\" : \"#666\",\n        confirmOpen: () => { if(this.state.awayReason.trim().length>3) this.setState({opened:true}); },\n      },\n\n      notif: ((scr===\"study\" && st.studyPhase===\"focus\") || st.actRunning) ? null : st.notif,\n      dismissNotif: () => this.setState({notif:null}),\n      replyNotif: () => this.setState({notif:null, screen:\"friends\", studyWith:null, studyElapsed:0}),\n      linkApp: ()=>{},\n      goBreathe: () => this.go(\"breathe\"),\n      goInstead: () => this.go(\"instead\"),\n      goEditor:  () => this.go(\"editor\"),\n      goFriends: () => this.go(\"friends\"),\n      goAway:    (e) => { if(e&&e.preventDefault) e.preventDefault(); this.go(\"away\"); },\n      openInsta: () => this.setState({reasoning:true}),\n\n      // steps overlay handled via detail — expose closer through instead nav\n      detail: st.detail,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
